name: Build Android app

# Builds the Zen Garden APK on GitHub's servers and puts it on the Releases page.
# Runs when the Android project changes, or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ZEN_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZEN_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No signing key yet. Add the ZEN_KEYSTORE_B64 and ZEN_KEYSTORE_PASSWORD repository secrets, then run this workflow again from the Actions tab."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zen.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed APK
        if: steps.key.outputs.ready == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/zen.jks
          KEYSTORE_PASSWORD: ${{ secrets.ZEN_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk zen-garden.apk

      - name: Test build (no signing key yet, not published)
        if: steps.key.outputs.ready != 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ready == 'true'
        with:
          name: zen-garden-apk
          path: zen-garden.apk

      - name: Publish to Releases
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app zen-garden.apk \
            --target "$GITHUB_SHA" \
            --title "Zen Garden app (build ${{ github.run_number }})" \
            --notes "Download zen-garden.apk on your phone and tap it to install. A newer build installs over the old one. Content updates every morning without reinstalling." \
            --latest
